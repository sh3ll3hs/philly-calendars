name: Update calendar feeds

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
    # Extra morning starts (5:41, 6:00 and 6:41 AM Eastern in winter). GitHub regularly drops the
    # 12:17 UTC slot above, and the combined feed rebuilds once on the first morning run (or skips if
    # a post-1:00 AM Eastern rebuild already completed today).
    - cron: "41 10 * * *"
    - cron: '0 11 * * *'
    - cron: "41 11 * * *"
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # continue-on-error: if one site changes and its script breaks, the other feed still updates
      - name: Build Philly Gay Calendar feed
        continue-on-error: true
        run: python3 pgc_to_ics.py --out docs/feed.ics --history docs/pgc_history.json
      - name: Build CreativePHL feed
        continue-on-error: true
        run: python3 creativephl_to_ics.py --out docs/creativephl.ics
      - name: Build WKDU Philly Haps feed
        continue-on-error: true
        run: python3 wkdu_to_ics.py --out docs/wkdu.ics --venues docs/wkdu_venues.json
      - name: Install scraping libraries
        run: pip install --quiet requests beautifulsoup4 python-dateutil curl_cffi
      # Parser tests run against saved pages; a failure here flags a parser bug
      # without stopping the feeds from publishing.
      - name: Test venue parsers
        continue-on-error: true
        run: python3 -m unittest discover -s tests
      - name: Run venue scrapers
        continue-on-error: true
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}   # optional; Ticketmaster houses are skipped without it
        run: python3 run_all.py --out-dir docs/venues
      - name: Build WXPN concert feed
        continue-on-error: true
        run: python3 xpn_to_ics.py --out docs/xpn.ics --times-cache docs/xpn_times.json
      - name: Build Grid Magazine feed
        continue-on-error: true
        run: python3 tribe_to_ics.py grid --out docs/grid.ics
      - name: Build Delco Arts feed
        continue-on-error: true
        run: python3 tribe_to_ics.py delcoarts --out docs/delcoarts.ics
      - name: Build County Lines Magazine feed
        continue-on-error: true
        run: python3 tribe_to_ics.py countylines --out docs/countylines.ics
      - name: Build Philly Family feed
        continue-on-error: true
        run: python3 tribe_to_ics.py phillyfamily --out docs/phillyfamily.ics
      - name: Build Bartram's Garden feed
        continue-on-error: true
        run: python3 tribe_to_ics.py bartrams --out docs/bartrams.ics
      # Runs at most once a day (the script skips itself otherwise) to keep load off the library's server
      - name: Build Free Library feed
        continue-on-error: true
        run: python3 flp_to_ics.py --out docs/flp.ics --history docs/flp_history.json
      - name: Build City of Philadelphia feed
        continue-on-error: true
        run: python3 phila_to_ics.py --out docs/phila.ics --list docs/phila_calendars.json
      # Everything without a feed of its own. Rebuilds on every morning run (5-10 AM Eastern) and otherwise
      # at most once every 11 h; the script skips itself the rest of the time.
      # A run started by hand (Actions tab > Run workflow) always rebuilds both feeds below: it passes
      # --force, which skips the wait. Scheduled runs keep the wait, so the sites are not read more
      # often than needed.
      - name: Build combined small-sources feed
        continue-on-error: true
        run: >-
          python3 combined_to_ics.py --out docs/combined.ics --state docs/combined_state.json
          ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      # LGBTQ+ career and tech organizations, nationwide (sources in queertech_sources.json). Same engine and
      # the same schedule rule as the combined feed; events are kept up to 400 days ahead for the conferences.
      - name: Build Queer Tech Events feed
        continue-on-error: true
        run: >-
          python3 combined_to_ics.py --sources queertech_sources.json --out docs/queertech.ics
          --state docs/queertech_state.json --name "Queer Tech Events" --rsvp-lines --days-ahead 400
          ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: Commit if changed
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update feed $(date -u +%F' '%H:%M)"
          git push
