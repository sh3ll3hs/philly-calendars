name: Update calendar feeds

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # continue-on-error: if one site changes and its script breaks, the other feed still updates
      - name: Build Philly Gay Calendar feed
        continue-on-error: true
        run: python3 pgc_to_ics.py --out docs/feed.ics --history docs/pgc_history.json
      - name: Build CreativePHL feed
        continue-on-error: true
        run: python3 creativephl_to_ics.py --out docs/creativephl.ics
      - name: Build WKDU Philly Haps feed
        continue-on-error: true
        run: python3 wkdu_to_ics.py --out docs/wkdu.ics --venues docs/wkdu_venues.json
      - name: Install scraping libraries
        run: pip install --quiet requests beautifulsoup4
      # Parser tests run against saved pages; a failure here flags a parser bug
      # without stopping the feeds from publishing.
      - name: Test venue parsers
        continue-on-error: true
        run: python3 -m unittest discover -s tests
      - name: Run venue scrapers
        continue-on-error: true
        env:
          TM_API_KEY: ${{ secrets.TM_API_KEY }}   # optional; Ticketmaster houses are skipped without it
        run: python3 run_all.py --out-dir docs/venues
      - name: Build WXPN concert feed
        continue-on-error: true
        run: python3 xpn_to_ics.py --out docs/xpn.ics --times-cache docs/xpn_times.json
      - name: Build Grid Magazine feed
        continue-on-error: true
        run: python3 grid_to_ics.py --out docs/grid.ics
      # Runs at most once a day (the script skips itself otherwise) to keep load off the library's server
      - name: Build Free Library feed
        continue-on-error: true
        run: python3 flp_to_ics.py --out docs/flp.ics --history docs/flp_history.json
      - name: Build City of Philadelphia feed
        continue-on-error: true
        run: python3 phila_to_ics.py --out docs/phila.ics --list docs/phila_calendars.json
      - name: Commit if changed
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update feed $(date -u +%F' '%H:%M)"
          git push
